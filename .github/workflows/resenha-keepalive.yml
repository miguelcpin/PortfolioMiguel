name: Resenha - despertador

# Acessa o servidor a cada 10 minutos para o plano grátis do Render não dormir
# (ele dorme depois de 15 minutos sem acesso). Ligado o mês todo dá ~744 h,
# dentro das 750 h grátis por mês.
# Para usar outro endereço, crie a variável de repositório RESENHA_URL
# (Settings > Secrets and variables > Actions > Variables).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acordar o servidor
        env:
          URL: ${{ vars.RESENHA_URL || 'https://resenha-miguel.onrender.com' }}
        run: |
          # Ao acordar, o Render pode levar até ~1 minuto para responder
          curl -fsS --max-time 100 --retry 3 --retry-delay 10 --retry-all-errors "$URL/api/health"
          echo
